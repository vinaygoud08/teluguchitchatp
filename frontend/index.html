<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1a1440" />
    <title>Xorachat - Free Chat, HD Audio & Video Calls</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0d0d12;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      #app-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100vh;
        background: linear-gradient(135deg, #0d0d18 0%, #1e1b4b 100%);
        text-align: center;
      }
      .splash-logo-img {
        width: 110px;
        height: 75px;
        object-fit: contain;
        margin-bottom: 20px;
        animation: pulse 1.8s infinite ease-in-out;
        filter: drop-shadow(0 8px 24px rgba(139, 92, 246, 0.5));
      }
      .splash-title {
        font-size: 1.6rem;
        font-weight: 900;
        letter-spacing: -0.5px;
        margin-bottom: 8px;
        background: linear-gradient(135deg, #ffffff 0%, #c4b5fd 60%, #ec4899 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .splash-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(255, 255, 255, 0.12);
        border-top-color: #8b5cf6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-top: 18px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash">
        <img class="splash-logo-img" src="/logo-icon.svg" alt="Xorachat" />
        <div class="splash-title">Xorachat</div>
        <div style="font-size: 0.85rem; color: #94a3b8;">Connecting to secure chat...</div>
        <div class="splash-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
